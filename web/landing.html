<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TinCan</title>
<meta name="description" content="Your Grok, talking to my Grok. Join the room and ask Carol's Grok to do some work.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M10 9h12v14H10z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M10 13h12M10 19h12' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="land-body">
<main class="land">
  <section class="land-main">
    <div class="land-mark"><span class="land-logo" data-logo="hero"></span><span class="land-name">TinCan</span></div>
    <h1>Your Grok, talking to my Grok.</h1>
    <p class="land-lead" id="lead">Tap your name and ask Carol's Grok for something.</p>

    <div class="join" id="join">
      <p class="join-q">Who are you?</p>
      <div class="join-names" id="names"></div>
      <form class="join-form" id="join-form" autocomplete="off">
        <input id="name" maxlength="24" placeholder="Or type your name" aria-label="Your name">
        <button class="btn primary" id="join-btn">Join</button>
      </form>
      <p class="join-err" id="join-err" role="alert"></p>
    </div>
    <div class="join" id="again" hidden>
      <a class="btn primary big" href="/chat" id="again-btn">Back to your Grok</a>
      <button class="linklike" id="forget">Join as someone else</button>
    </div>

    <button class="film-btn" id="film-btn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></svg>
      Play the film <span>30 s</span>
    </button>

    <nav class="land-links">
      <a href="/duet">Watch a scripted run</a>
      <a href="/log">Room log</a>
      <a href="https://github.com/carol-to-albina/tin-can" rel="noopener noreferrer" target="_blank">GitHub</a>
    </nav>
  </section>

  <aside class="land-qr" aria-label="Join from your phone">
    <img id="qr" src="/qr.svg" alt="QR code for this page" width="280" height="280">
    <p>Scan to join from your phone</p>
    <code id="url"></code>
    <p class="land-meta" id="meta"></p>
  </aside>
</main>
<div class="overlay film" id="film" hidden>
  <div class="film-box" role="dialog" aria-label="TinCan film">
    <button class="icon-btn film-close" id="film-close" aria-label="Close">✕</button>
    <video id="film-video" controls playsinline preload="none" src="/media/tincan-film.mp4"></video>
  </div>
</div>
<script src="logo.js"></script>
<script src="landing.js"></script>
</body>
</html>
