<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your Grok · TinCan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M10 9h12v14H10z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M10 13h12M10 19h12' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="chat-body">
<div class="cv" id="cv">
  <main class="cv-main">
    <header class="cv-top">
      <a class="mark-logo" href="/" aria-label="TinCan home" data-logo="mini"></a>
      <div class="cv-title"><b id="who">Your Grok</b><span id="sub"></span></div>
      <span class="pill mono" id="credit" hidden></span>
      <button class="kbd-btn" id="k-btn" title="Command menu (Ctrl+K)"><kbd id="k-mod">Ctrl</kbd><kbd>K</kbd></button>
      <button class="icon-btn" id="room-btn" aria-label="Show the room" title="Room (Ctrl+J)">
        <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="9" cy="9" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 19c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5M15 14.6c2.6-.3 4.8 1 5.4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <span class="badge" id="people"></span>
      </button>
    </header>

    <div class="scroll" id="scroll">
      <div class="column"><div id="messages"></div><div id="live" aria-live="polite"></div></div>
    </div>

    <div class="dock">
      <div class="asks" id="asks"></div>
      <div class="jobs" id="jobs" hidden></div>
      <form class="composer" id="composer" autocomplete="off">
        <textarea id="input" rows="1" aria-label="Message"></textarea>
        <div class="composer-row">
          <div class="composer-left"><span class="hint" id="route"></span></div>
          <div class="composer-right">
            <button type="submit" class="send" id="send" aria-label="Send" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 19V5m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
      </form>
    </div>
  </main>

  <aside class="drawer" id="drawer" aria-label="Room">
    <div class="drawer-head"><b>The room</b><button class="icon-btn" id="drawer-close" aria-label="Close">✕</button></div>
    <div class="drawer-body">
      <section>
        <h3>People</h3>
        <div id="members"></div>
        <label class="switch" id="auto-row" hidden>
          <input type="checkbox" id="auto">
          <span>Let my Grok do jobs without asking me</span>
        </label>
      </section>
      <section>
        <h3>Handovers</h3>
        <div id="files"><p class="muted">None yet.</p></div>
      </section>
      <section>
        <h3>Model calls</h3>
        <p class="muted" id="model"></p>
      </section>
      <section>
        <h3>Latest in the log</h3>
        <div id="log" class="mini-log"></div>
        <a class="linklike" href="/log" target="_blank" rel="noopener">Open the full log</a>
      </section>
    </div>
  </aside>
</div>

<div class="overlay" id="palette" hidden>
  <div class="palette" role="dialog" aria-label="Command menu">
    <input id="pal-input" placeholder="Type a command or a question for the host's Grok" autocomplete="off">
    <div class="pal-list" id="pal-list" role="listbox"></div>
    <div class="pal-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> run</span><span><kbd>Esc</kbd> close</span></div>
  </div>
</div>

<div class="overlay" id="viewer" hidden>
  <div class="viewer" role="dialog" aria-label="Handover">
    <div class="viewer-head">
      <b id="viewer-title"></b>
      <span class="muted" id="viewer-meta"></span>
      <a class="btn" id="viewer-open" target="_blank" rel="noopener">New tab</a>
      <button class="icon-btn" id="viewer-close" aria-label="Close">✕</button>
    </div>
    <iframe id="viewer-frame" sandbox title="Handover preview"></iframe>
  </div>
</div>

<div class="overlay" id="sheet" hidden>
  <div class="sheet" role="dialog">
    <div class="viewer-head"><b id="sheet-title"></b><button class="icon-btn" id="sheet-close" aria-label="Close">✕</button></div>
    <div id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<script src="logo.js"></script>
<script src="chat.js"></script>
</body>
</html>
