<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TinCan Duet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M10 9h12v14H10z' fill='none' stroke='%23fff' stroke-width='2.2' stroke-linejoin='round'/%3E%3Cpath d='M10 13h12M10 19h12' stroke='%23fff' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body class="duet-body">
<header class="duet-top">
  <a class="mark" href="/" title="TinCan">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M6 5.5h12v13H6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6 9.5h12M6 14.5h12" stroke="currentColor" stroke-width="1.3"/><path d="M18 12c2.5 0 3.5 1.2 3.5 3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
  </a>
  <div class="duet-title">
    <b>TinCan</b>
    <span>Two people. Two Groks. One tin can.</span>
  </div>
  <div class="top-right">
    <span class="pill" id="model" title="Model behind both Groks"></span>
    <span class="pill mono" id="spend" title="Spent on the model this session">$0.000</span>
    <span class="pill mono" id="clock">0.0s</span>
    <button class="icon-btn" id="theme" aria-label="Toggle theme" title="Toggle theme">
      <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>
    </button>
    <button class="btn primary" id="play">
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M7 5v14l12-7z" fill="currentColor"/></svg>
      Play demo
    </button>
  </div>
</header>

<p class="caption" id="caption">Each person talks only to their own Grok. Both gave permission when they joined. Press Play.</p>

<main class="duet" id="duet">
  <section class="pane" data-me="albina"></section>
  <section class="wire" aria-label="Room">
    <div class="wire-head">The room</div>
    <div class="wire-rail" aria-hidden="true"><span class="can left"></span><span class="string"></span><span class="can right"></span><span class="spark" id="spark"></span></div>
    <div class="wire-lines" id="wire-lines"></div>
  </section>
  <section class="pane" data-me="carol"></section>
</main>

<template id="pane-tpl">
  <div class="pane-head">
    <span class="avatar"></span>
    <div class="pane-who"><b></b><span class="pane-sub"></span></div>
    <span class="state pane-mode"></span>
  </div>
  <div class="pane-scroll"><div class="pane-msgs"></div></div>
  <form class="composer mini" autocomplete="off">
    <textarea rows="1"></textarea>
    <button type="submit" class="send" aria-label="Send" disabled>
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 19V5m0 0-6 6m6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </form>
</template>

<div class="toast" id="toast" role="status" hidden></div>
<script src="duet.js"></script>
</body>
</html>
