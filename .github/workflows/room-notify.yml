name: room-notify

on:
  push:
    paths:
      - ".room/out/**"
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Notify room recipients
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GROK_WEBHOOK_URL_ALBINA: ${{ secrets.GROK_WEBHOOK_URL_ALBINA }}
          GROK_WEBHOOK_KEY_ALBINA: ${{ secrets.GROK_WEBHOOK_KEY_ALBINA }}
          GROK_WEBHOOK_URL_CAROL: ${{ secrets.GROK_WEBHOOK_URL_CAROL }}
          GROK_WEBHOOK_KEY_CAROL: ${{ secrets.GROK_WEBHOOK_KEY_CAROL }}
        run: python3 scripts/room.py hook-notify
